  </defs>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#0e1420"/>
  <!-- left session -->
  <rect x="8" y="20" width="16" height="24" rx="4" fill="none" stroke="url(#g)" stroke-width="3"/>
  <line x1="12" y1="28" x2="20" y2="28" stroke="#4f8cff" stroke-width="2" stroke-linecap="round"/>
  <line x1="12" y1="34" x2="18" y2="34" stroke="#4f8cff" stroke-width="2" stroke-linecap="round"/>
  <!-- right session -->
